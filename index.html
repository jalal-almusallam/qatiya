<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قطية المباراة</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #162032;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --blue: #2563eb;
      --blue-soft: rgba(37, 99, 235, 0.16);
      --red: #dc2626;
      --red-soft: rgba(220, 38, 38, 0.16);
      --green: #16a34a;
      --green-soft: rgba(22, 163, 74, 0.16);
      --amber: #eab308;
      --amber-soft: rgba(234, 179, 8, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
    }

    .amount-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.95rem;
    }

    .amount-box input {
      width: 68px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
